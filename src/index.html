<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MOHASingphony</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <script>
    (function() {
      try {
        var lsTheme = localStorage.getItem('theme');
        // Make light the default when no preference is stored
        if (lsTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          // Default to light: ensure dark class is removed
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {
        // If localStorage is blocked, default to light
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>
</head>
<body class="mat-typography">
  <app-root></app-root>
</body>
</html>
