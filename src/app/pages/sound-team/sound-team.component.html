<div class="min-h-screen w-full bg-[var(--ms-bg)] text-[var(--ms-text)] font-['Inter']">
  <app-notification></app-notification>

  <app-sound-team-header
    [isDarkMode]="isDarkMode()"
    [unreadCount]="unreadCount()"
    (toggleTheme)="toggleTheme()"
    (openNotifications)="unreadCount.set(0)"
  ></app-sound-team-header>

  <main class="mx-auto w-full max-w-[1600px] px-4 py-6 md:px-6 lg:px-8">
    <!-- Hero -->
    <app-sound-status-hero
      class="block"
      [status]="soundStatus()"
      [sessionName]="sessionName()"
      [lastUpdate]="lastUpdate()"
      [connectedDevices]="connectedDevices()"
      [connectedMusicians]="connectedMusicians()"
    ></app-sound-status-hero>

    <!-- Control panel -->
    <div class="mt-6">
      <app-sound-control-panel
        [activeState]="soundStatus()"
        (stateChange)="onStateChange($event)"
      ></app-sound-control-panel>
    </div>

    <!-- Main grid -->
    <div class="mt-6 grid grid-cols-1 gap-6 lg:grid-cols-12">
      <!-- Left column: communication -->
      <div class="flex flex-col gap-6 lg:col-span-5">
        <app-communication-hub
          [templates]="messageTemplates()"
          (sendMessage)="onSendMessage($event)"
        ></app-communication-hub>

        <app-quick-response-center
          [responses]="quickResponses()"
          (sendResponse)="onQuickResponse($event)"
        ></app-quick-response-center>
      </div>

      <!-- Right column: live feed + widgets -->
      <div class="flex flex-col gap-6 lg:col-span-7">
        <app-live-feed
          [messages]="messages()"
          [autoScroll]="true"
        ></app-live-feed>

        <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
          <app-issue-tracker-widget
            [issues]="issues()"
            (resolveIssue)="onResolveIssue($event)"
          ></app-issue-tracker-widget>

          <app-recent-actions-widget
            [actions]="recentActions()"
          ></app-recent-actions-widget>
        </div>
      </div>
    </div>

    <!-- Bottom widgets -->
    <div class="mt-6 grid grid-cols-1 gap-6 md:grid-cols-2">
      <app-channel-status-widget
        [channels]="channels()"
      ></app-channel-status-widget>

      <app-system-health-widget
        [systems]="systems()"
      ></app-system-health-widget>
    </div>
  </main>
</div>
