<section class="flex h-full flex-col rounded-[24px] border border-[var(--ms-border-subtle)] bg-[var(--ms-card)] shadow-[var(--ms-shadow-md)]">
  <div class="flex items-center justify-between border-b border-[var(--ms-border-subtle)] px-5 py-4 md:px-6">
    <div class="flex items-center gap-2">
      <span class="material-icons text-[18px] text-[var(--ms-text-secondary)]">stream</span>
      <h3 class="text-[14px] font-semibold uppercase tracking-wider text-[var(--ms-text-muted)]">Live Feed</h3>
    </div>
    <div class="flex items-center gap-2">
      <span class="relative flex h-2 w-2">
        <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-[var(--ms-success)] opacity-75"></span>
        <span class="relative inline-flex h-2 w-2 rounded-full bg-[var(--ms-success)]"></span>
      </span>
      <span class="text-[12px] font-medium text-[var(--ms-text-muted)]">Live</span>
    </div>
  </div>

  <div class="flex-1 overflow-y-auto p-4 md:p-5" style="max-height: 520px;">
    <div *ngIf="messages().length > 0; else emptyFeed" class="space-y-4">
      <div
        *ngFor="let message of messages(); let first = first"
        class="feed-item flex gap-3"
        [class.opacity-60]="message.acknowledged"
      >
        <div class="flex flex-col items-center gap-1 pt-1">
          <span
            class="material-icons text-[18px]"
            [style.color]="typeColor(message.type)"
          >
            fiber_manual_record
          </span>
          <div class="h-full w-px flex-1 bg-[var(--ms-border-subtle)]"></div>
        </div>

        <div class="flex-1 pb-4">
          <div class="mb-1 flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="text-[13px] font-semibold text-[var(--ms-text)]">{{ senderName(message.sender) }}</span>
              <span
                class="rounded-full px-1.5 py-0.5 text-[10px] font-bold uppercase tracking-wider"
                [style.background-color]="typeColor(message.type) + '20'"
                [style.color]="typeColor(message.type)"
              >
                {{ message.type.replace('_', ' ') }}
              </span>
            </div>
            <span class="text-[11px] font-medium text-[var(--ms-text-muted)]">{{ message.timestamp | date:'shortTime' }}</span>
          </div>
          <p class="text-[14px] leading-relaxed text-[var(--ms-text-secondary)]">{{ messageText(message) }}</p>
        </div>
      </div>
    </div>

    <ng-template #emptyFeed>
      <div class="flex h-full flex-col items-center justify-center py-12 text-center">
        <span class="material-icons mb-2 text-[40px] text-[var(--ms-text-muted)]">notifications_none</span>
        <p class="text-[14px] text-[var(--ms-text-muted)]">No messages yet</p>
        <p class="text-[12px] text-[var(--ms-text-muted)]">Activity will appear here in real-time</p>
      </div>
    </ng-template>
  </div>
</section>
