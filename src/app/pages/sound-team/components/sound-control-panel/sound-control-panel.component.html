<section class="rounded-[24px] border border-[var(--ms-border-subtle)] bg-[var(--ms-card)] p-5 shadow-[var(--ms-shadow-md)] md:p-6">
  <div class="mb-5 flex items-center gap-2">
    <span class="material-icons text-[18px] text-[var(--ms-text-secondary)]">dashboard</span>
    <h3 class="text-[14px] font-semibold uppercase tracking-wider text-[var(--ms-text-muted)]">Sound Control Panel</h3>
  </div>

  <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-5">
    <button
      *ngFor="let state of states"
      type="button"
      (click)="stateChange.emit(state.value)"
      class="group relative flex flex-col items-center gap-3 rounded-[20px] border p-4 text-center transition-all duration-200 md:p-5"
      [class.active]="activeState() === state.value"
      [attr.aria-pressed]="activeState() === state.value"
    >
      <div
        class="flex h-12 w-12 items-center justify-center rounded-full transition-all duration-200 md:h-14 md:w-14"
        [style.background-color]="activeState() === state.value ? 'color-mix(in srgb, ' + state.color + ' 15%, transparent)' : 'var(--ms-bg)'"
      >
        <span
          class="material-icons text-[24px] md:text-[28px] transition-all duration-200"
          [style.color]="activeState() === state.value ? state.color : 'var(--ms-text-secondary)'"
        >
          {{ state.icon }}
        </span>
      </div>

      <div>
        <div
          class="text-[15px] font-semibold transition-colors duration-200"
          [class.text-[var(--ms-text)]]="activeState() === state.value"
          [class.text-[var(--ms-text-secondary)]]="activeState() !== state.value"
        >
          {{ state.label }}
        </div>
        <div class="mt-0.5 text-[11px] leading-tight text-[var(--ms-text-muted)]">{{ state.description }}</div>
      </div>

      <span
        *ngIf="activeState() === state.value"
        class="absolute right-3 top-3 h-2.5 w-2.5 rounded-full"
        [style.background-color]="state.color"
      ></span>
    </button>
  </div>
</section>
