<div class="rounded-[24px] border border-[var(--ms-border-subtle)] bg-[var(--ms-card)] p-5 shadow-[var(--ms-shadow-md)]">
  <div class="mb-5 flex items-center gap-2">
    <span class="material-icons text-[18px] text-[var(--ms-text-secondary)]">graphic_eq</span>
    <h3 class="text-[14px] font-semibold uppercase tracking-wider text-[var(--ms-text-muted)]">Channel Status</h3>
  </div>

  <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-2 xl:grid-cols-3">
    <div
      *ngFor="let channel of channels()"
      class="rounded-[16px] border border-[var(--ms-border-subtle)] bg-[var(--ms-bg)] p-3"
    >
      <div class="mb-3 flex items-center gap-2">
        <span class="material-icons text-[18px] text-[var(--ms-text-secondary)]">{{ channel.icon }}</span>
        <span class="text-[13px] font-semibold text-[var(--ms-text)]">{{ channel.name }}</span>
      </div>
      <div class="space-y-2">
        <div class="flex items-center justify-between text-[11px]">
          <span class="text-[var(--ms-text-muted)]">Signal</span>
          <span class="font-semibold capitalize" [style.color]="statusColor(channel.signal)">{{ channel.signal }}</span>
        </div>
        <div class="flex items-center justify-between text-[11px]">
          <span class="text-[var(--ms-text-muted)]">Volume</span>
          <span class="font-semibold capitalize" [style.color]="statusColor(channel.volume)">{{ channel.volume }}</span>
        </div>
        <div class="flex items-center justify-between text-[11px]">
          <span class="text-[var(--ms-text-muted)]">Connection</span>
          <span class="font-semibold capitalize" [style.color]="statusColor(channel.connection)">{{ channel.connection }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
