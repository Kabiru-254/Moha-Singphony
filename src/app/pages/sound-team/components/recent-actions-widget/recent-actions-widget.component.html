<div class="rounded-[24px] border border-[var(--ms-border-subtle)] bg-[var(--ms-card)] p-5 shadow-[var(--ms-shadow-md)]">
  <div class="mb-5 flex items-center gap-2">
    <span class="material-icons text-[18px] text-[var(--ms-text-secondary)]">history</span>
    <h3 class="text-[14px] font-semibold uppercase tracking-wider text-[var(--ms-text-muted)]">Recent Actions</h3>
  </div>

  <div class="relative space-y-0 pl-2">
    <div class="absolute left-[19px] top-2 bottom-2 w-px bg-[var(--ms-border-subtle)]"></div>

    <div
      *ngFor="let action of actions(); let last = last"
      class="relative flex gap-3 pb-4"
      [class.pb-0]="last"
    >
      <div
        class="relative z-10 flex h-3 w-3 shrink-0 translate-y-1.5 rounded-full"
        [style.background-color]="action.color || 'var(--ms-primary)'"
      ></div>
      <div class="flex flex-1 items-start justify-between gap-2">
        <div>
          <div class="flex items-center gap-2">
            <span class="material-icons text-[16px] text-[var(--ms-text-secondary)]">{{ action.icon }}</span>
            <span class="text-[14px] font-semibold text-[var(--ms-text)]">{{ action.label }}</span>
          </div>
          <div class="text-[12px] text-[var(--ms-text-muted)]">{{ action.timestamp | date:'shortTime' }}</div>
        </div>
      </div>
    </div>

    <div *ngIf="actions().length === 0" class="py-4 text-center text-[14px] text-[var(--ms-text-muted)]">
      No recent actions
    </div>
  </div>
</div>
