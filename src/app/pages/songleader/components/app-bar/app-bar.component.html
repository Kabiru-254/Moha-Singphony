<header
  class="sticky top-0 z-40 w-full border-b border-black/5 dark:border-white/5 px-6 py-5 backdrop-blur-[10px] bg-[var(--ms-bg)]/80 dark:bg-[var(--ms-bg-elevated)]/60 md:px-8 md:py-6 lg:px-12"
  role="banner"
>
  <div class="max-w-[1600px] mx-auto flex justify-between items-center">
    <h1 class="text-xl font-bold tracking-tight m-0 text-[var(--ms-text)]">
      MOHA SINGPHONY
    </h1>

    <div class="flex items-center gap-2">
      <button
        type="button"
        (click)="onOpenNotifications()"
        class="relative bg-transparent border border-black/15 dark:border-white/15 rounded-full w-10 h-10 flex items-center justify-center cursor-pointer transition-all duration-200 text-[var(--ms-text)] hover:bg-black/5 dark:hover:bg-white/10"
        aria-label="Notifications"
      >
        <span class="material-icons text-[20px]">notifications</span>
        <span
          *ngIf="unreadCount > 0"
          class="absolute right-1 top-1 flex h-4 min-w-4 items-center justify-center rounded-full bg-ms-danger px-1 text-[10px] font-bold text-white"
        >
          {{ unreadCount }}
        </span>
      </button>

      <button
        type="button"
        (click)="onToggleTheme()"
        class="bg-transparent border border-black/15 dark:border-white/15 rounded-full w-10 h-10 flex items-center justify-center cursor-pointer transition-all duration-200 text-[var(--ms-text)] hover:bg-black/5 hover:border-black/25 dark:hover:bg-white/10 dark:hover:border-white/25"
        aria-label="Toggle theme"
      >
        <svg
          *ngIf="!isDarkMode()"
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="5" />
          <line x1="12" y1="1" x2="12" y2="3" />
          <line x1="12" y1="21" x2="12" y2="23" />
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
          <line x1="1" y1="12" x2="3" y2="12" />
          <line x1="21" y1="12" x2="23" y2="12" />
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
        <svg
          *ngIf="isDarkMode()"
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      </button>
    </div>
  </div>
</header>
