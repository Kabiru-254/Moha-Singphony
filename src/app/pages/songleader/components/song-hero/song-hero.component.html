<section class="song-hero relative overflow-hidden rounded-[28px] border p-6 md:p-8 lg:p-10" aria-label="Current song control center">
  <!-- Animated background layers -->
  <div class="absolute inset-0 bg-gradient-to-br from-ms-primary/20 via-transparent to-ms-secondary/20"></div>
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_30%_20%,rgba(99,102,241,0.15),transparent_40%)]"></div>
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_70%_80%,rgba(139,92,246,0.12),transparent_40%)]"></div>

  <!-- Glass overlay -->
  <div class="absolute inset-0 bg-[var(--ms-surface-glass)] backdrop-blur-[2px]"></div>

  <div class="relative z-10 flex h-full flex-col justify-between">
    <!-- Top row: section & status -->
    <div class="flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="ms-badge-section">
          <span class="material-icons text-[12px]">queue_music</span>
          {{ section() }}
        </span>
      </div>
      <div class="flex items-center gap-2">
        <span class="relative flex h-2.5 w-2.5">
          <span class="absolute inline-flex h-full w-full animate-ms-live-pulse rounded-full bg-ms-success opacity-75"></span>
          <span class="relative inline-flex h-2.5 w-2.5 rounded-full bg-ms-success"></span>
        </span>
        <span class="text-[12px] font-semibold uppercase tracking-wider text-ms-success">Live Broadcast</span>
      </div>
    </div>

    <!-- Center: Song identity -->
    <div class="my-6 flex flex-1 flex-col justify-center md:my-8">
      <p class="mb-2 text-[13px] font-semibold uppercase tracking-wider text-[var(--ms-text-muted)]">Current Song</p>
      <h1
        class="max-w-4xl text-[clamp(32px,6vw,72px)] font-bold leading-[1.05] tracking-tight text-[var(--ms-text)]"
        [class.text-[var(--ms-text-muted)]]="!hasSong()"
      >
        {{ title() }}
      </h1>
      <p class="mt-2 text-[18px] font-medium text-[var(--ms-text-secondary)]">{{ artist() }}</p>
    </div>

    <!-- Current Instruction Banner -->
    <div
      *ngIf="currentInstruction()"
      class="instruction-banner mb-6 overflow-hidden rounded-[20px] border border-white/10 bg-gradient-to-r from-ms-primary/90 to-ms-secondary/90 px-6 py-4 text-white shadow-ms-glow md:mb-8"
      [@bannerPulse]="currentInstruction()"
      role="status"
      aria-live="polite"
    >
      <div class="flex items-center gap-4">
        <span class="material-icons text-[28px] md:text-[32px]">campaign</span>
        <div class="min-w-0 flex-1">
          <p class="text-[12px] font-semibold uppercase tracking-wider text-white/70">Current Instruction</p>
          <p class="text-[clamp(20px,3vw,36px)] font-black leading-tight tracking-tight">{{ currentInstruction() }}</p>
        </div>
      </div>
    </div>

    <!-- Bottom: Metrics & broadcast -->
    <div class="flex flex-col gap-6 lg:flex-row lg:items-end lg:justify-between">
      <!-- Metrics -->
      <div class="flex flex-wrap items-center gap-3">
        <button
          type="button"
          class="metric-pill"
          aria-label="Current key"
          (click)="onToggleKeyPanel()"
        >
          <span class="material-icons text-[16px] text-ms-primary">music_note</span>
          <span class="text-[14px] font-bold text-[var(--ms-text)]">Key {{ key() }}</span>
        </button>
        <div class="metric-pill">
          <span class="material-icons text-[16px] text-ms-success">speed</span>
          <span class="text-[14px] font-bold text-[var(--ms-text)]">{{ tempo() }} BPM</span>
        </div>
      </div>

      <!-- Broadcast -->
      <button
        type="button"
        class="control-btn control-btn-broadcast"
        aria-label="Broadcast current song"
        (click)="onBroadcast()"
      >
        <span class="material-icons text-[20px]">cast</span>
        <span class="hidden text-[13px] font-semibold sm:inline">Broadcast</span>
      </button>
    </div>
  </div>
</section>
