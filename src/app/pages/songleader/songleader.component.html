<div class="min-h-screen w-full bg-[var(--ms-bg)]">
  <!-- Notification Component -->
  <app-notification></app-notification>

  <!-- Top App Bar -->
  <app-app-bar
    [isDarkMode]="theme() === 'dark'"
    (toggleTheme)="toggleTheme()"
    (openNotifications)="notificationService.clearAllNotifications()"
  ></app-app-bar>

  <!-- Main Dashboard -->
  <main class="mx-auto max-w-[1600px] p-4 md:p-6 lg:p-8">
    <!-- Hero Control Center -->
    <app-song-hero
      [state]="currentSongState()"
      [currentInstruction]="broadcastingCommand() || ''"
      (broadcast)="broadcastCurrentSong()"
      (toggleKeyPanel)="toggleKeyPanel()"
    ></app-song-hero>

    <!-- Dashboard Grid -->
    <div class="mt-6 grid grid-cols-1 gap-6 lg:grid-cols-12 lg:gap-8">
      <!-- Left column: Setlist & Controls -->
      <div class="flex flex-col gap-6 lg:col-span-7 xl:col-span-8">
        <!-- Key Selector Panel -->
        <div
          *ngIf="showKeyPanel()"
          class="overflow-hidden"
          [@panelExpand]="showKeyPanel()"
        >
          <app-key-selector
            [keys]="allKeys()"
            [selectedKey]="currentKey()"
            [compact]="false"
            (selectKey)="selectKey($event)"
          ></app-key-selector>
        </div>

        <!-- Setlist Management -->
        <app-setlist-panel
          [setlist]="currentSetlist()"
          [currentSongState]="currentSongState()"
          [searchResults]="filteredSongs()"
          [searchQuery]="searchQuery()"
          (queryChange)="onSearchQueryChange($event)"
          (addSong)="addToSetlist($event)"
          (selectSong)="selectSong($event)"
          (broadcastSong)="broadcastSong($event)"
          (removeSong)="removeFromSetlist($event)"
          (reorder)="onReorderSetlist($event)"
          (broadcastSetlist)="broadcastSetlist()"
          (addNewSong)="openSongSetupModal()"
        ></app-setlist-panel>

        <!-- Live Control Center -->
        <app-live-control-center
          [state]="currentSongState()"
          [broadcastingCommand]="broadcastingCommand()"
          (transposeDown)="transposeKey(-1)"
          (transposeUp)="transposeKey(1)"
          (tempoDown)="adjustTempo('slower')"
          (tempoUp)="adjustTempo('faster')"
          (tempoSet)="setTempo($event)"
          (instruction)="sendMusicalInstruction($event)"
        ></app-live-control-center>
      </div>

      <!-- Right column: Widgets -->
      <div class="flex flex-col gap-6 lg:col-span-5 xl:col-span-4">
        <!-- Analytics -->
        <app-analytics-widget
          [songsPlayed]="songsPlayed()"
          [averageTempo]="averageTempo()"
          [responseTimeMs]="24"
          [activeMusicians]="musicians.length"
          [messagesSent]="messagesSent()"
          [songsRemaining]="songsRemaining()"
        ></app-analytics-widget>

        <!-- Connected Musicians -->
        <app-musicians-widget
          [musicians]="musicians"
          [totalConnected]="musicians.length"
        ></app-musicians-widget>

        <!-- Broadcast Activity -->
        <app-broadcast-feed
          [messages]="messageHistory()"
        ></app-broadcast-feed>

        <!-- Quick Notes -->
        <app-quick-notes
          [notes]="quickNotes()"
          (notesChange)="onNotesChange($event)"
        ></app-quick-notes>
      </div>
    </div>
  </main>

  <!-- Add New Song Modal -->
  <div
    *ngIf="showSongSetupModal()"
    class="fixed inset-0 z-50 flex items-center justify-center p-4"
    role="dialog"
    aria-modal="true"
    aria-labelledby="song-modal-title"
  >
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" (click)="closeSongSetupModal()"></div>
    <div class="relative w-full max-w-md rounded-[24px] border p-6 shadow-ms-2xl"
         style="background: var(--ms-card); border-color: var(--ms-border-subtle);">
      <div class="mb-5 flex items-center justify-between">
        <h2 id="song-modal-title" class="text-[20px] font-bold text-[var(--ms-text)]">Add New Song</h2>
        <button
          type="button"
          class="icon-btn"
          aria-label="Close modal"
          (click)="closeSongSetupModal()"
        >
          <span class="material-icons text-[20px]">close</span>
        </button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="mb-1.5 block text-[13px] font-semibold text-[var(--ms-text)]">Song Title</label>
          <input
            type="text"
            [value]="newSong().title"
            placeholder="Enter song title"
            class="ms-input"
            (input)="setNewSongTitle($event)"
          />
        </div>

        <div>
          <label class="mb-1.5 block text-[13px] font-semibold text-[var(--ms-text)]">Key</label>
          <div class="grid grid-cols-4 gap-2">
            <button
              *ngFor="let key of allKeys()"
              type="button"
              class="rounded-[12px] border px-2 py-2 text-[14px] font-semibold transition-all"
              [style.background]="newSong().key === key ? 'linear-gradient(135deg, var(--ms-primary), var(--ms-secondary))' : 'var(--ms-card)'"
              [style.border-color]="newSong().key === key ? 'transparent' : 'var(--ms-border-subtle)'"
              [style.color]="newSong().key === key ? 'white' : 'var(--ms-text)'"
              (click)="setNewSongKey(key)"
            >
              {{ key }}
            </button>
          </div>
        </div>

        <div>
          <label class="mb-1.5 block text-[13px] font-semibold text-[var(--ms-text)]">Structure</label>
          <input
            type="text"
            [value]="newSong().structure"
            placeholder="Verse, Chorus, Bridge, Chorus"
            class="ms-input"
            (input)="setNewSongStructure($event)"
          />
          <p class="mt-1 text-[11px] text-[var(--ms-text-muted)]">Comma-separated sections</p>
        </div>
      </div>

      <div class="mt-6 flex justify-end gap-3">
        <button
          type="button"
          class="ms-btn-ghost"
          (click)="closeSongSetupModal()"
        >
          Cancel
        </button>
        <button
          type="button"
          class="ms-btn-primary"
          [disabled]="!newSong().title"
          (click)="saveSong()"
        >
          Save Song
        </button>
      </div>
    </div>
  </div>
</div>
