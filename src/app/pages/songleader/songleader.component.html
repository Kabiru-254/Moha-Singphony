<div class="p-6 dark:bg-gray-900 dark:text-white h-full flex flex-col space-y-6">
  <!-- Header -->
  <header class="flex justify-between items-center">
    <h1 class="text-2xl font-bold text-gray-800 dark:text-gray-200">🎶 Song Leader View</h1>
    <div class="flex items-center">
      <span class="mr-2 text-sm text-gray-600 dark:text-gray-400">Theme</span>
      <label class="switch">
        <input type="checkbox" id="themeToggle" (change)="toggleTheme()" />
        <span class="slider"></span>
      </label>
    </div>
  </header>

  <!-- Songs Section -->
  <section>
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-lg font-semibold text-gray-700 dark:text-gray-300">Songs</h2>
      <button
        class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded-full flex items-center shadow-md"
        (click)="navigateToSongManagement()"
      >
        <span class="material-icons mr-2">add</span> Manage Songs
      </button>
    </div>
    <div *ngIf="songs && songs.length" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div
        *ngFor="let song of songs"
        class="group bg-gray-100 dark:bg-gray-800 p-4 rounded-lg shadow-lg flex items-center justify-between hover:bg-blue-100 dark:hover:bg-blue-700 transition"
        (click)="selectSong(song)"
      >
        <span class="text-sm font-medium text-gray-800 dark:text-gray-200">{{ song.name }}</span>
        <span class="material-icons text-gray-500 group-hover:text-blue-500">chevron_right</span>
      </div>
    </div>
    <p *ngIf="!songs || songs.length === 0" class="text-gray-500 text-center">
      No songs available. <span class="text-blue-500 underline cursor-pointer" (click)="navigateToSongManagement()">Add songs</span>.
    </p>
  </section>

  <!-- Real-Time Commands -->
  <section>
    <h2 class="text-lg font-semibold mb-4 text-gray-700 dark:text-gray-300">Real-Time Commands</h2>
    <div class="grid grid-cols-2 gap-6 sm:grid-cols-4">
      <!-- Key Controls -->
      <div class="p-4 bg-white dark:bg-gray-800 rounded-lg shadow-md">
        <p class="font-medium text-gray-800 dark:text-gray-200 mb-3">Key: {{ currentKey }}</p>
        <div class="flex justify-between">
          <button
            class="py-2 px-4 bg-green-500 hover:bg-green-600 text-white rounded-md shadow"
            (click)="transposeKey(1)"
          >
            + Key
          </button>
          <button
            class="py-2 px-4 bg-red-500 hover:bg-red-600 text-white rounded-md shadow"
            (click)="transposeKey(-1)"
          >
            - Key
          </button>
        </div>
      </div>
      <!-- Tempo Controls -->
      <div class="p-4 bg-white dark:bg-gray-800 rounded-lg shadow-md">
        <p class="font-medium text-gray-800 dark:text-gray-200 mb-3">Tempo</p>
        <div class="flex justify-between">
          <button
            class="py-2 px-4 bg-green-500 hover:bg-green-600 text-white rounded-md shadow"
            (click)="adjustTempo(1)"
          >
            + Tempo
          </button>
          <button
            class="py-2 px-4 bg-red-500 hover:bg-red-600 text-white rounded-md shadow"
            (click)="adjustTempo(-1)"
          >
            - Tempo
          </button>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mt-6">
      <button
        *ngFor="let cmd of quickCommands"
        class="bg-gray-200 dark:bg-gray-700 py-2 px-3 rounded-lg shadow hover:bg-blue-200 dark:hover:bg-blue-600 transition"
        (click)="sendCommand(cmd)"
      >
        {{ cmd }}
      </button>
    </div>
  </section>

  <!-- Targeted Commands -->
  <section>
    <h2 class="text-lg font-semibold mb-4 text-gray-700 dark:text-gray-300">Targeted Commands</h2>
    <div class="flex flex-wrap gap-2">
      <label
        *ngFor="let target of availableTargets"
        class="flex items-center bg-gray-200 dark:bg-gray-700 py-2 px-4 rounded-lg shadow cursor-pointer"
      >
        <input
          type="checkbox"
          class="mr-3 w-4 h-4"
          [value]="target"
          [(ngModel)]="selectedTargets"
        />
        <span class="text-gray-800 dark:text-gray-200">{{ target }}</span>
      </label>
    </div>
  </section>
</div>
